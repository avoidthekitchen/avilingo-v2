name: BeakSpeak CI

on:
  pull_request:
    paths:
      - 'beakspeak/**'
      - 'content/**'
      - 'manual_audio.py'
      - 'test_manual_audio.py'
      - 'scripts/build-site.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/beakspeak-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'beakspeak/**'
      - 'content/**'
      - 'manual_audio.py'
      - 'test_manual_audio.py'
      - 'scripts/build-site.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/beakspeak-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beakspeak

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manual audio test dependencies
        working-directory: .
        run: |
          python -m pip install requests pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Manual audio tests
        working-directory: .
        run: python -m pytest -q test_manual_audio.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beakspeak/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Mobile E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: beakspeak/playwright-report
          if-no-files-found: ignore
